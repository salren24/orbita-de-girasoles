<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxia de flores amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#000; --oro:#ffc83a; --oro-claro:#fff1b8; --texto:#fffbea; --tenue:rgba(255,251,234,.65);
    --titulo:"Chewy", "Comic Sans MS", system-ui, sans-serif;
    --mano:"Gochi Hand", "Comic Sans MS", cursive;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --negro:#000; } }
  :root[data-theme="dark"]{ --negro:#000; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--negro); color:var(--texto); font-family:var(--mano); -webkit-tap-highlight-color:transparent; }
  canvas#c{ position:fixed; inset:0; display:block; touch-action:none; cursor:grab; }
  canvas#c:active{ cursor:grabbing; }
  #capa{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  #titulo{ position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 8vh); text-align:center; pointer-events:none;
    margin:0; padding:0 16px; font-family:var(--titulo); font-weight:400; font-size:clamp(26px,4.6vw,52px); line-height:1.1;
    color:#ffe07a; letter-spacing:.01em; opacity:0; transition:opacity 2.5s ease;
    text-shadow:0 0 6px rgba(255,210,70,.95), 0 0 18px rgba(255,170,20,.8), 0 0 40px rgba(255,140,0,.45); }
  #titulo.visible{ opacity:1; }

  .chispa{ position:absolute; font-size:24px; pointer-events:none; animation:chispa 1.3s ease-out forwards; }
  @keyframes chispa{ from{ transform:translate(-50%,-50%) scale(.4); opacity:1 } to{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity:0 } }

  #pista{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); text-align:center; font-size:17px;
    color:var(--tenue); pointer-events:none; opacity:0; transition:opacity 1.5s ease; padding:0 70px; }
  #pista.visible{ opacity:1; }

  #sonido{ position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,200,58,.45); background:rgba(30,20,0,.55); color:var(--oro-claro); font-size:18px; cursor:pointer; display:none; }
  #sonido:focus-visible, .inicio:focus-visible{ outline:2px solid var(--oro); outline-offset:3px; }

  #portada{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(circle at 50% 50%, #2a1c00 0%, #000 60%); transition:opacity 1.2s ease; z-index:5; padding:24px; overflow:auto; }
  #portada.oculta{ opacity:0; pointer-events:none; }
  .inicio{ all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; border-radius:16px; padding:10px; }
  .inicio .flor{ width:120px; height:auto; animation:latido 2.2s ease-in-out infinite; filter:drop-shadow(0 0 22px rgba(255,190,50,.8)); }
  .inicio span{ font-family:var(--mano); font-size:30px; color:var(--oro-claro); text-shadow:0 0 12px rgba(255,190,50,.7); }
  @keyframes latido{ 0%,100%{ transform:scale(1) rotate(0) } 50%{ transform:scale(1.08) rotate(5deg) } }
  @media (prefers-reduced-motion: reduce){ .inicio .flor{ animation:none; } }

</style>
</head>
<body>
<canvas id="c" aria-label="Galaxia de frases, girasoles y ramos de flores alrededor de un agujero negro con anillo dorado"></canvas>
<div id="capa" aria-hidden="true"></div>
<h1 id="titulo">Feliz Día de las Flores Amarillas</h1>
<div id="pista">Arrastra para girar, usa la rueda para acercarte y toca para soltar flores</div>
<button id="sonido" aria-label="Silenciar música">🔊</button>

  // ---------- Sprites ----------
  function spriteFrase(txt, icono) {
    const fs = 46, pad = 26;
    const c = document.createElement('canvas');
    const g = c.getContext('2d');
    const fuente = `${fs}px "Gochi Hand", "Comic Sans MS", cursive`;
    g.font = fuente;
    const anchoTxt = g.measureText(txt).width;
    c.width = Math.ceil(anchoTxt + fs * 1.25 + pad * 2);
    c.height = Math.ceil(fs * 1.5 + pad * 2);
    g.textBaseline = 'middle';
    g.font = `${fs * 0.78}px serif`;
    g.shadowColor = 'rgba(255,190,40,.9)'; g.shadowBlur = 10;
    g.fillText(icono, pad, c.height / 2 + 2);
    g.font = fuente;
    g.fillStyle = '#fffbea';
    g.shadowColor = 'rgba(255,200,50,1)'; g.shadowBlur = 16;
    g.fillText(txt, pad + fs * 1.15, c.height / 2);
    g.shadowBlur = 5;
    g.fillText(txt, pad + fs * 1.15, c.height / 2);
    return { c, alto: 0.62 };
  }

  // Carga una imagen y la pasa a un canvas con un resplandor dorado alrededor
  function cargarImagen(src) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => res(null);
      img.src = src;
    });
  }

  function spriteImagen(img, alto, brillo) {
    const m = 30;
    const c = document.createElement('canvas');
    c.width = img.width + m * 2; c.height = img.height + m * 2;
    const g = c.getContext('2d');
    g.shadowColor = `rgba(255,190,40,${brillo})`;
    g.shadowBlur = 24;
    g.drawImage(img, m, m);
    g.shadowBlur = 0;
    g.drawImage(img, m, m);
    return { c, alto };
  }

  // ---------- Campo 3D de elementos ----------
  const items = [];
  function posicionLibre() {
    for (;;) {
      const x = (Math.random() * 2 - 1) * 17;
      const y = (Math.random() * 2 - 1) * 9.5;
      const z = (Math.random() * 2 - 1) * 15;
      if (Math.abs(x) < 5.5 && Math.abs(y) < 2.2 && Math.abs(z) < 5.5) continue;
      return { x, y, z };
    }
  }
  function agregar(sprite, n) { for (let i = 0; i < n; i++) items.push({ sprite, ...posicionLibre(), b: Math.random() * TAU }); }

  async function construirCampo() {
    try {
      await Promise.race([document.fonts.load('46px "Gochi Hand"'), new Promise(r => setTimeout(r, 2500))]);
    } catch (e) {}
    const spritesFrases = frases.map((f, i) => spriteFrase(f, iconos[i % iconos.length]));

    for (let i = 0; i < totalFrases; i++) agregar(spritesFrases[i % spritesFrases.length], 1);

    const [imgGirasol, imgRamoG, imgRamoR] = await Promise.all([
      cargarImagen(RECURSOS.girasol), cargarImagen(RECURSOS.ramoGirasoles), cargarImagen(RECURSOS.ramoRosas)
    ]);

    if (imgRamoG) agregar(spriteImagen(imgRamoG, 2.2, 0.5), movil ? 8 : 13);

  // ---------- Agujero negro ----------
  const motas = Array.from({ length: 160 }, () => ({ r: 2.0 + Math.random() * 3.1, a: Math.random() * TAU, s: Math.random() * 1.6 + 0.6 }));
  const R_ESFERA = 1.55, R_INT = 1.9, R_EXT = 5.0;

  function anilloMitad(frente, s0, squash) {
    ctx.save();
    ctx.beginPath();
    if (frente) ctx.rect(0, cy, W, H - cy); else ctx.rect(0, 0, W, cy);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.scale(1, squash);
    const ri = R_INT * s0, re = R_EXT * s0;
    const gr = ctx.createRadialGradient(0, 0, ri, 0, 0, re);
    gr.addColorStop(0, '#fff6cf');
    const franjas = 14;
    for (let i = 1; i <= franjas; i++) {
      const p = 0.04 + (i / franjas) * 0.82;
      gr.addColorStop(p, i % 2 ? 'rgba(255,214,60,1)' : 'rgba(255,178,20,.92)');
    }
    gr.addColorStop(0.93, 'rgba(255,150,0,.55)');
    gr.addColorStop(1, 'rgba(255,130,0,0)');
    ctx.fillStyle = gr;
    ctx.shadowColor = 'rgba(255,170,20,.9)';
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(0, 0, re, 0, TAU);
    ctx.arc(0, 0, ri, 0, TAU, true);
    ctx.fill('evenodd');
    ctx.restore();
  }

  function agujero(t, dt) {
    const s0 = FOCAL / cam;
    const squash = Math.max(0.06, Math.sin(elev));
    const R = R_ESFERA * s0;

    const halo = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 4.2);
    halo.addColorStop(0, 'rgba(255,200,80,.5)');
    halo.addColorStop(0.4, 'rgba(255,160,30,.16)');
    halo.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, R * 4.2, 0, TAU); ctx.fill();

    anilloMitad(false, s0, squash);
    dibujarMotas(false, s0, squash, dt);

    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,80,.25)'; ctx.lineWidth = 1.5;
    ctx.stroke();

    anilloMitad(true, s0, squash);
    dibujarMotas(true, s0, squash, 0);
  }

  function dibujarMotas(frente, s0, squash, dt) {
    ctx.fillStyle = '#fffbe0';
    for (const m of motas) {
      if (dt) m.a += (1.2 / Math.pow(m.r, 1.5)) * dt * VEL;
      const sn = Math.sin(m.a);
      if ((sn > 0) !== frente) continue;
      const x = cx + Math.cos(m.a) * m.r * s0, y = cy + sn * m.r * s0 * squash;
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(sn);
      ctx.fillRect(x - m.s / 2, y - m.s / 2, m.s, m.s);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Proyección de elementos ----------
  const visibles = [];
  function proyectarItems(t) {
    visibles.length = 0;
    const cy_ = Math.cos(yaw), sy_ = Math.sin(yaw);
    const pitch = (elev - 0.2) * 0.8;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    for (const it of items) {
      const yb = it.y + Math.sin(t * 0.6 + it.b) * 0.12;
      const X = it.x * cy_ - it.z * sy_;
      const Z = it.x * sy_ + it.z * cy_;
      const Y = yb * cp - Z * sp;
      const Z2 = yb * sp + Z * cp;
      const zc = Z2 + cam;
      if (zc < 0.9) continue;
      const s = FOCAL / zc;
      const h = it.sprite.alto * s * 0.55;
      const w = h * (it.sprite.c.width / it.sprite.c.height);
      const sx = cx + X * s, sy = cy + Y * s;
      if (sx + w / 2 < 0 || sx - w / 2 > W || sy + h / 2 < 0 || sy - h / 2 > H) continue;
      const cerca = Math.min(1, (zc - 0.9) / 2.2);
      const lejos = Math.min(1, Math.max(0.15, 1.25 - zc / 45));
      visibles.push({ it, sx, sy, w, h, zc, a: cerca * lejos });
    }
    visibles.sort((a, b) => b.zc - a.zc);
  }

  function dibujarVisibles(detras) {
    for (const v of visibles) {
      if ((v.zc > cam) !== detras) continue;
      ctx.globalAlpha = v.a;
      ctx.drawImage(v.it.sprite.c, v.sx - v.w / 2, v.sy - v.h / 2, v.w, v.h);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Interacción ----------
  let arrastre = null;
  cv.addEventListener('pointerdown', e => {
    arrastre = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!arrastre) return;
    yaw += (e.clientX - arrastre.x) * 0.005;
    elev = Math.min(0.75, Math.max(0.06, elev + (e.clientY - arrastre.y) * 0.003));
    arrastre.x = e.clientX; arrastre.y = e.clientY;
  });
  cv.addEventListener('pointerup', e => {
    if (arrastre && iniciado && Math.hypot(e.clientX - arrastre.x0, e.clientY - arrastre.y0) < 8) lluviaDeFlores(e.clientX, e.clientY);
    arrastre = null;
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    camObjetivo = Math.min(26, Math.max(7, camObjetivo * (e.deltaY > 0 ? 1.08 : 0.92)));
  }, { passive: false });

  const capaDom = document.getElementById('capa');
  function lluviaDeFlores(x, y) {
    const n = reducido ? 5 : 11;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'chispa';
      s.textContent = i % 4 === 0 ? '🌸' : '🌻';
      const a = (i / n) * TAU + Math.random() * 0.4, d = 60 + Math.random() * 70;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      capaDom.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }
  }

  // ---------- Música ----------
  let audio = null, audioCtx = null, maestro = null, silenciado = false;
  const btnSonido = document.getElementById('sonido');

  function melodiaAmbiental() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      maestro = audioCtx.createGain();
      maestro.gain.value = 0.0001;
      const filtro = audioCtx.createBiquadFilter();
      filtro.type = 'lowpass'; filtro.frequency.value = 1500;
      maestro.connect(filtro); filtro.connect(audioCtx.destination);
      maestro.gain.exponentialRampToValueAtTime(0.14, audioCtx.currentTime + 3);
      const acordes = [[261.63, 329.63, 392, 523.25], [220, 261.63, 329.63, 440], [174.61, 220, 261.63, 349.23], [196, 246.94, 293.66, 392]];
      let k = 0;
      const tocar = () => {
        const t0 = audioCtx.currentTime, acorde = acordes[k++ % acordes.length];
        for (const f of acorde) {
          for (const [tipo, det] of [['sine', 0], ['triangle', 7]]) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = tipo; o.frequency.value = f; o.detune.value = det;
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(tipo === 'sine' ? 0.08 : 0.025, t0 + 2.5);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 9.5);
            o.connect(g); g.connect(maestro);
            o.start(t0); o.stop(t0 + 10);
          }
        }
        [0.8, 2.2, 3.4].forEach((d, j) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = acorde[(j + 1) % 4] * 2;
          g.gain.setValueAtTime(0.0001, t0 + d);
          g.gain.exponentialRampToValueAtTime(0.045, t0 + d + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 2.6);
          o.connect(g); g.connect(maestro);
          o.start(t0 + d); o.stop(t0 + d + 2.8);
        });
      };
      tocar();
      setInterval(tocar, 7000);
    } catch (e) {}
  }

  btnSonido.addEventListener('click', () => {
    silenciado = !silenciado;
    if (audio) audio.muted = silenciado;
    if (maestro && audioCtx) maestro.gain.setTargetAtTime(silenciado ? 0.0001 : 0.14, audioCtx.currentTime, 0.3);
    btnSonido.textContent = silenciado ? '🔈' : '🔊';
    btnSonido.setAttribute('aria-label', silenciado ? 'Activar música' : 'Silenciar música');
  });

  // ---------- Inicio ----------
  document.getElementById('btnInicio').addEventListener('click', () => {
    if (iniciado) return;
    iniciado = true;
    // Canción incluida
    audio = new Audio(RECURSOS.musica);
    audio.loop = true;
    audio.volume = 0.8;
    audio.play().catch(() => { audio = null; melodiaAmbiental(); });

    camObjetivo = 14;
    btnSonido.style.display = 'block';
    document.getElementById('portada').classList.add('oculta');
    setTimeout(() => document.getElementById('titulo').classList.add('visible'), 1600);
    setTimeout(() => document.getElementById('pista').classList.add('visible'), 3000);
    setTimeout(() => document.getElementById('pista').classList.remove('visible'), 11000);
  });

  // ---------- Bucle ----------
  let previo = performance.now();
  function cuadro(ahora) {
    const dt = Math.min(0.05, (ahora - previo) / 1000);
    previo = ahora;
    const t = ahora / 1000;

    cam += (camObjetivo - cam) * Math.min(1, dt * (iniciado ? 0.9 : 3));
    if (!arrastre) yaw += 0.045 * dt * VEL;

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    for (const e of estrellas) {
      ctx.globalAlpha = 0.25 + 0.6 * Math.abs(Math.sin(t * e.v * 0.5 + e.f));
      ctx.fillRect(e.x * W, e.y * H, e.s, e.s);
    }
    ctx.globalAlpha = 1;

    proyectarItems(t);
    dibujarVisibles(true);
    agujero(t, dt);
    dibujarVisibles(false);

    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
